kind = "web"
previewPath = "/"
title = "Subtitle Translator"
description = "A browser-based SRT subtitle translator that preserves original numbering and timecodes while translating dialogue in configurable batches through the Gemini API. Includes progress tracking, retry and pause controls, and UTF-8 subtitle downloads."
version = "1.0.0"
id = "artifacts/subtitle-translator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19196

[services.development]
run = "pnpm --filter @workspace/subtitle-translator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/subtitle-translator", "run", "build" ]
serve = "static"
publicDir = "artifacts/subtitle-translator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19196"
BASE_PATH = "/"
